[package]
name = "visualadvance-tauri"
version = "0.1.0"
description = "Universal Emulator desktop app"
authors = ["VisualAdvance"]
edition = "2021"

[lib]
name = "visualadvance_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
